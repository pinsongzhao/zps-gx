<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=./docs/index.html">
    <title>Redirecting to GalfitX Documentation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #ffd700;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Redirecting to GalfitX Documentation</h1>
        <p>If you are not redirected automatically, <a href="./docs/index.html">click here</a>.</p>
        <p>Visit us at: <a href="https://pinsongzhao.github.io/zps-gx/docs/index.html">https://pinsongzhao.github.io/zps-gx/docs/index.html</a></p>
    </div>

    <script>
        // Alternative JavaScript redirect in case meta redirect doesn't work
        setTimeout(function() {
            window.location.href = "./docs/index.html";
        }, 500);
    </script>
</body>
</html>
